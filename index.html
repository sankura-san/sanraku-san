<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Maynard K. Nay-osan — Computer Science student and aspiring software developer.">
  <title>Maynard K. Nay-osan — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/homepage-refinement.css">
</head>
<body>
  <div class="cd" id="cd" aria-hidden="true"><i></i></div>
  <div class="cr" id="cr" aria-hidden="true"><i></i></div>
  <canvas id="smoke" aria-hidden="true"></canvas>
  <div class="fb" aria-hidden="true"></div>

  <div class="app">
    <header>
      <a class="logo" href="#home" id="logo" aria-label="Home">MN</a>
      <nav id="nav" aria-label="Sections"></nav>
      <button class="tg" id="tg" type="button" aria-label="Switch theme">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <mask id="mk"><rect width="24" height="24" fill="#fff"/><circle class="cut" cx="24" cy="2" r="7" fill="#000"/></mask>
          <circle class="core" cx="12" cy="12" r="5" fill="currentColor" mask="url(#mk)"/>
          <path class="rays" d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
    </header>

    <main>
      <figure>
        <img id="photo" src="assets/portrait.jpg" alt="Portrait of Maynard K. Nay-osan in a dark suit and tie">
        <figcaption>Portfolio 2026</figcaption>
      </figure>
      <div class="right">
        <div class="identity">
          <h1 id="name"></h1>
          <div class="role" id="role"></div>
        </div>
        <section class="panel" id="panel" aria-live="polite"><div class="view" id="view"></div></section>
        <div class="foot">
          <span class="pg" id="pg"></span>
          <button class="next" id="next" type="button"><span class="lbl">Continue</span><span class="arr" aria-hidden="true"><i>→</i><i>→</i></span></button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/smoke.js"></script>
  <script src="js/main.js"></script>
  <script src="js/homepage-refinement.js"></script>
</body>
</html>
